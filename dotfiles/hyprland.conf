# See https://wiki.hyprland.org/Configuring/Monitors/
# monitor=DP-5, 3840x2160@144.05, 0x0, 1.0,bitdepth,10,vrr,2
# monitor=DP-5, 3840x2160@144.05, 0x0,1.0,vrr,2
# monitor=DP-4, 2560x1440@60, 3840x300, 1

# skib
debug {
  full_cm_proto=true
}

monitorv2 {
  output = desc:LG Electronics LG ULTRAGEAR+ 401NTWG55801 
  mode = 3840x2160@144.05
  position = 0x0
  scale = 1
  vrr = 1
  bitdepth = 8
}

monitorv2 {
  output = desc:BNQ BenQ LCD V7G11754019
  mode = 2560x1440@60
  position = 3840x300
  scale = 1
}

monitorv2 {
  output = desc:Samsung Electric Company SAMSUNG 0x00000001
  mode = 1920x1080@60
  position = auto-left
  scale = 1
}
# See https://wiki.hyprland.org/Configuring/Keywords/ for more

# Execute your favorite apps at launch
# exec-once = waybar & hyprpaper & firefox

# Source a file (multi-file configs)
# source = ~/.config/hypr/myColors.conf

# For all categories, see https://wiki.hyprland.org/Configuring/Variables/
input {
    kb_layout = us
    kb_variant =
    kb_model =
    kb_options =
    kb_rules =

    follow_mouse = 1

    touchpad {
        natural_scroll = no
    }

    sensitivity = 0 # -1.0 - 1.0, 0 means no modification.
    
    numlock_by_default = true
}

general {
    # See https://wiki.hyprland.org/Configuring/Variables/ for more

    gaps_in = 0
    gaps_out = 0 
    border_size = 1
    col.active_border = rgba(33ccffee) rgba(00ff99ee) 45deg
    col.inactive_border = rgba(595959aa)

    layout = master 
}

decoration {
    # See https://wiki.hyprland.org/Configuring/Variables/ for more

    rounding = 0

    blur {
      enabled = true
      size = 3
      passes = 1
      new_optimizations = on
    }

    # drop_shadow = yes 
    # shadow_range = 4
    # shadow_render_power = 3
    # col.shadow = rgba(1a1a1aee)
}

animations {
    enabled = yes 

    # Some default animations, see https://wiki.hyprland.org/Configuring/Animations/ for more

    bezier = myBezier, 0.05, 0.9, 0.1, 1.05

    animation = windows, 1, 7, myBezier
    animation = windowsOut, 1, 7, default, popin 80%
    animation = border, 1, 10, default
    animation = fade, 1, 7, default
    animation = workspaces, 1, 6, default
}

dwindle {
    # See https://wiki.hyprland.org/Configuring/Dwindle-Layout/ for more
    pseudotile = yes # master switch for pseudotiling. Enabling is bound to mainMod + P in the keybinds section below
    preserve_split = yes # you probably want this
}

master {
    # See https://wiki.hyprland.org/Configuring/Master-Layout/ for more
    # orientation = right
}

gestures {
    # See https://wiki.hyprland.org/Configuring/Variables/ for more
    # workspace_swipe = off
}

# Example per-device config
# See https://wiki.hyprland.org/Configuring/Keywords/#executing for more
# device:epic mouse V1 {
#     sensitivity = -0.5
# }

# Example windowrule v1
# windowrule = float, ^(kitty)$
# Example windowrule v2
# windowrulev2 = float,class:^(kitty)$,title:^(kitty)$
# See https://wiki.hyprland.org/Configuring/Window-Rules/ for more



# See https://wiki.hyprland.org/Configuring/Keywords/ for more
$mainMod = SUPER

# Example binds, see https://wiki.hyprland.org/Configuring/Binds/ for more
bind = $mainMod, RETURN, exec, kitty
bind = $mainMod + SHIFT, q, killactive 
bind = $mainMod, W, exec, firefox 
bind = $mainMod, E, exec, dolphin
bind = $mainMod, V, togglefloating 
bind = $mainMod, f, fullscreen # dwindle
bind = ALT, SPACE, exec, tofi-run | xargs hyprctl dispatch exec -- 
bind = $mainMod, P, pseudo # dwindle
bind = $mainMod, J, togglesplit # dwindle

# focus window
bind = $mainMod, s, focusmonitor, +1 # dwindle
bind = $mainMod SHIFT, s, swapactiveworkspaces, DP-3 HDMI-A-5 # dwindle

# Move focus with mainMod + arrow keys
bind = $mainMod, h, movefocus, l
bind = $mainMod, l, movefocus, r
bind = $mainMod, k, movefocus, u
bind = $mainMod, j, movefocus, d

# Switch workspaces with mainMod + [0-9]
# bind = $mainMod, 1, workspace, 1
# bind = $mainMod, 2, workspace, 2
# bind = $mainMod, 3, workspace, 3
# bind = $mainMod, 4, workspace, 4
# bind = $mainMod, 5, workspace, 5
# bind = $mainMod, 6, workspace, 6
# bind = $mainMod, 7, workspace, 7
# bind = $mainMod, 8, workspace, 8
# bind = $mainMod, 9, workspace, 9
# bind = $mainMod, 0, workspace, 10

bind = $mainMod, 1, exec, /home/caleb/.config/hypr/dispatch.sh 1
bind = $mainMod, 2, exec, /home/caleb/.config/hypr/dispatch.sh 2
bind = $mainMod, 3, exec, /home/caleb/.config/hypr/dispatch.sh 3
bind = $mainMod, 4, exec, /home/caleb/.config/hypr/dispatch.sh 4
bind = $mainMod, 5, exec, /home/caleb/.config/hypr/dispatch.sh 5
bind = $mainMod, 6, exec, /home/caleb/.config/hypr/dispatch.sh 6
bind = $mainMod, 7, exec, /home/caleb/.config/hypr/dispatch.sh 7
bind = $mainMod, 8, exec, /home/caleb/.config/hypr/dispatch.sh 8
bind = $mainMod, 9, exec, /home/caleb/.config/hypr/dispatch.sh 9

# Move active window to a workspace with mainMod + SHIFT + [0-9]
bind = $mainMod SHIFT, 1, movetoworkspacesilent, 1
bind = $mainMod SHIFT, 2, movetoworkspacesilent, 2
bind = $mainMod SHIFT, 3, movetoworkspacesilent, 3
bind = $mainMod SHIFT, 4, movetoworkspacesilent, 4
bind = $mainMod SHIFT, 5, movetoworkspacesilent, 5
bind = $mainMod SHIFT, 6, movetoworkspacesilent, 6
bind = $mainMod SHIFT, 7, movetoworkspacesilent, 7
bind = $mainMod SHIFT, 8, movetoworkspacesilent, 8
bind = $mainMod SHIFT, 9, movetoworkspacesilent, 9
bind = $mainMod SHIFT, 0, movetoworkspacesilent, 10

# Scroll through existing workspaces with mainMod + scroll
bind = $mainMod, mouse_down, workspace, e+1
bind = $mainMod, mouse_up, workspace, e-1

# Move/resize windows with mainMod + LMB/RMB and dragging
bindm = $mainMod, mouse:272, movewindow
bindm = $mainMod, mouse:273, resizewindow

# Audio keys
$volume_up  = pamixer -u -i 2 --allow-boost
$volume_down  = pamixer -d 2
$toggle_mute = pamixer -t
$volume_changed_sound = paplay /usr/share/sounds/freedesktop/stereo/audio-volume-change.oga
$current_mic = alsa_input.usb-BLUE_MICROPHONE_Blue_Snowball_201507-00.pro-input-0.2

bind = ,XF86AudioRaiseVolume, exec, $volume_up && $volume_changed_sound
bind = ,XF86AudioLowerVolume, exec, $volume_down && $volume_changed_sound

bind = ,XF86AudioMute, exec, $toggle_mute
bind = SHIFT ,XF86AudioMute, exec, $toggle_mute --default-source # --source $current_mic

# Managing master layout
bind = $mainMod, m, layoutmsg, swapwithmaster master
bind = $mainMod, 21, layoutmsg, addmaster
bind = $mainMod, 20, layoutmsg, removemaster


# clipboard maanager
bind = SUPER, b, exec, cliphist list | fuzzel --dmenu | cliphist decode | wl-copy

bind = $mainMod CTRL, code:47, exec, systemctl suspend 

# Screenshot;
bind = $mainMod SHIFT, s, exec, grim -g "$(slurp)" - | swappy -f -


# Start up
exec-once = wl-paste --type text --watch cliphist store #Stores only text data
exec-once = wl-paste --type image --watch cliphist store #Stores only image data

# exec-once=dbus-update-activation-environment --systemd WAYLAND_DISPLAY XDG_CURRENT_DESKTOP
exec-once = waybar
exec-once = ~/.config/autostart/swayidle-hyprctl-dpms.sh 300
exec-once = hyprpaper
exec-once = udiskie 
exec-once = swaync

# just copied from project page. I should package this on nix packages.
$hypremoji = /home/caleb/rgits/HyprEmoji/target/release/hypremoji
bind = Super, period, exec, $hypremoji
windowrulev2 = float, title:^(HyprEmoji)$
